[project]
name = "jctranz-ai-workflow"
version = "1.0.0"
description = "FastAPI AI workflow backend for OpenAI script generation and fal.AI product video generation."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "motor>=3.5.0",
  "openai>=1.99.0",
  "fal-client>=0.5.0",
  "python-dotenv>=1.0.1",
  "python-multipart>=0.0.9",
  "cloudinary>=1.41.0"
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0",
  "pytest>=8.3.0",
  "httpx>=0.27.0"
]

[tool.ruff]
line-length = 100
target-version = "py311"
